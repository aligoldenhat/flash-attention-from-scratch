[build-system]
requires = ["setuptools>=64", "wheel", "torch"]
build-backend = "setuptools.build_meta"

[project]
name = "fa"
version = "0.1.0"
description = "FlashAttention-2 forward pass written from scratch in CUDA C++"
requires-python = ">=3.10"
dependencies = ["torch"]

[project.optional-dependencies]
dev = ["pytest", "numpy", "pandas", "matplotlib", "ninja"]

[tool.pytest.ini_options]
testpaths = ["tests"]
